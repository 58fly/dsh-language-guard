name: test

# 为什么需要 CI（而不是本机手跑 npm test）：
#
# 1. scripts/verify-dispose.mjs 需要真 @deepseek-ai/cordis 才能跑 7 项卸载判据。
#    本机是 `npm install --no-save` 临时装的，别人克隆后工作区没有它，
#    脚本会打印 TODO 并 exit 0 —— 判据看起来「通过」，其实一条都没跑。
#    CI 用 `npm ci` 装 devDependencies，这些判据才真的执行。
# 2. 工作区天然干净，不会因为本地残留的 node_modules / 临时文件而假绿。
#
# 为什么这里不跑 scripts/verify-checklist.sh：
#
# - 它的 R16 执行 `npm publish --dry-run`，会触发 prepublishOnly
#   → scripts/verify-release.mjs，后者要求 HEAD 上存在 v<version> tag。
#   CI 检出的 commit 在 PR 上必然没有 tag，R16 会假红。
# - 它的 R23 是打包体积的精确字节断言，而 `npm pack` 的产物字节随 npm 版本变化，
#   跨机器会假红。
# 这两项仍由本机发布流程（npm test）承担；等 CI 稳定跑几轮后再考虑引入。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语言解析与镜像段等价性
        run: |
          node scripts/verify-language.mjs
          node scripts/verify-mirror.mjs

      - name: 客户端降级与槽注册
        run: node scripts/verify-client.mjs

      - name: 真容器卸载验证
        run: node scripts/verify-dispose.mjs

      - name: 清单与打包元数据
        run: node scripts/verify-manifest.mjs

name: test

# 为什么需要 CI（而不是本机手跑 npm test）：
#
# 1. scripts/verify-dispose.mjs 需要真 @deepseek-ai/cordis 才能跑 7 项卸载判据。
#    本机是 `npm install --no-save` 临时装的，别人克隆后工作区没有它，
#    脚本会打印 TODO 并 exit 0 —— 判据看起来「通过」，其实一条都没跑。
#    CI 用 `npm ci` 装 devDependencies，这些判据才真的执行。
# 2. 工作区天然干净，不会因为本地残留的 node_modules / 临时文件而假绿。
#
# 为什么这里不跑 scripts/verify-checklist.sh 的完整判据：
#
# 它以 LG_CI=1 运行（见最后一步）。CI 模式只降级两条与环境绑定的判据：
#
# - R16 执行 `npm publish --dry-run`，会触发 prepublishOnly
#   → scripts/verify-release.mjs，后者要求本地存在 v<version> tag。
#   checkout 默认不拉 tag，PR 上更是必然没有，故 CI 用 `--ignore-scripts` 跳过
#   prepublishOnly，只保留 npm 自身的打包/白名单/名称校验。
# - R23 是打包体积的精确字节断言，而 `npm pack` 的产物字节随 npm 版本变化，
#   跨机器不可移植，CI 里打印 SKIP 而不是假红。
# 这两条仍由本机发布流程（npm test）承担；其余 72 项在 CI 里真跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语言解析与镜像段等价性
        run: |
          node scripts/verify-language.mjs
          node scripts/verify-mirror.mjs

      - name: 客户端降级与槽注册
        run: node scripts/verify-client.mjs

      - name: 真容器卸载验证
        run: node scripts/verify-dispose.mjs

      - name: 清单与打包元数据
        run: node scripts/verify-manifest.mjs

      - name: 验收清单（CI 模式：R23 跳过，R16 跳过 prepublishOnly）
        env:
          LG_CI: '1'
        run: bash scripts/verify-checklist.sh
